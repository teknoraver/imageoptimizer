apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'net.teknoraver.imageoptimizer'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "net.teknoraver.imageoptimizer"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 23
        versionName "1.9.2"
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        // jniLibs here are jpegoptim/optipng shipped as lib*.so so the OS extracts them
        // to applicationInfo.nativeLibraryDir, the one app-private location SELinux
        // permits executing from. That requires them to actually be extracted as real
        // files at install time rather than left compressed/mmapped inside the APK.
        jniLibs {
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':seekbar')
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
}
